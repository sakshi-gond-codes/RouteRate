{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card mt-4"><div class="card-body p-4">
    <h1 class="h4 fw-bold"><i class="bi bi-trash3 text-danger me-2"></i>Delete {{ object_name }}?</h1>
    <p class="text-body-secondary mb-3">This cannot be undone.</p>
    {% if warning %}<div class="alert alert-warning small">{{ warning }}</div>{% endif %}
    <form method="post" class="d-flex gap-2">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Yes, delete</button>
      <a class="btn btn-light" href="{% url cancel_url %}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
